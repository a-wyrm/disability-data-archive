services:
  db:
    container_name: backend
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: disability_archive
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGUSER: ${DB_USERNAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d disability_archive"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    container_name: frontend
    build: .
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${DB_USERNAME}:${DB_PASSWORD}@db:5432/disability_archive
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
